plugins {
    id 'groovy'
    id 'java'
}

group 'com.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.codehaus.groovy:groovy:3.0.21'
    // --- Zależności Produkcyjne (`main`) ---
    implementation 'org.codehaus.groovy:groovy-all:3.0.18'
    // implementation 'org.codehaus.groovy:groovy-json:3.0.18'  groovy-all już zawiera w sobie groovy-json, więc ta linia jest zbędna
    implementation 'com.github.tomakehurst:wiremock-jre8-standalone:2.35.0'

    // --- Zależności Testowe (`test`) ---
    testImplementation 'org.spockframework:spock-core:2.3-groovy-3.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.github.tomakehurst:wiremock-jre8:2.35.0'

    // I potrzebują wszystkich narzędzi do testów integracyjnych
    testImplementation 'com.sparkjava:spark-core:2.9.4'
    testImplementation 'org.slf4j:slf4j-simple:1.7.32'
    testImplementation 'org.awaitility:awaitility-groovy:4.2.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.9.3'
}

test {
    useJUnitPlatform()
    testLogging.showStandardStreams = true
}

// === OSTATECZNE ROZWIĄZANIE PROBLEMU Z DUPLIKATEM PLIKU AST ===
// Ta konfiguracja mówi Gradle, jak ma przetwarzać zasoby testowe.
processTestResources {
    // W przypadku duplikatów w META-INF/services, nie rzucaj błędem,
    // po prostu dołącz oba pliki. To jest kluczowe dla Spocka i naszego DSL-a.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}