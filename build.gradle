plugins {
    id 'groovy'
}

group 'com.example'
version '1.0-SNAPSHOT'

// --- TUTAJ JEST KLUCZOWA ZMIANA ---
repositories {
    // jcenter() // <-- ZAKOMENTUJ LUB USUŃ TĘ LINIĘ
    mavenCentral() // <-- DODAJ TĘ LINIĘ. To jest obecny standard.
}
// ------------------------------------

// Upewnijmy się, że używamy Javy 8, zgodnie z wymaganiami zadania
sourceCompatibility = 1.8

dependencies {
    // Zależności produkcyjne (powinny tu być interfejsy i proste DTO)
    implementation 'org.codehaus.groovy:groovy-all:2.5.4'

    // Zależności WYŁĄCZNIE do testów
    testImplementation 'org.spockframework:spock-core:1.3-groovy-2.5'
    testImplementation 'junit:junit:4.12'
    testImplementation 'cglib:cglib-nodep:3.2.12'
    testImplementation 'org.objenesis:objenesis:2.6'

    // Zależności do serwera i klienta HTTP w testach
    testImplementation 'com.sparkjava:spark-core:2.9.4'
    // testImplementation 'com.github.groovy-wslite:groovy-wslite:1.1.3' // <-- USUŃ LUB ZAKOMENTUJ
    testImplementation 'org.slf4j:slf4j-simple:1.7.32'

    testImplementation('org.awaitility:awaitility-groovy:4.2.0') {
        // Wykluczamy przechodnią zależność do org.codehaus.groovy
        exclude group: 'org.codehaus.groovy', module: 'groovy'
    }

    testImplementation 'com.squareup.okhttp3:mockwebserver:4.9.3'
}

test {
    testLogging.showStandardStreams = true
}