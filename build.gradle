plugins {
    id 'groovy'
    id 'java'
}

group 'com.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

dependencies {
    // --- Zależności Produkcyjne (`main`) ---
    implementation 'org.codehaus.groovy:groovy:3.0.18'
    implementation 'org.codehaus.groovy:groovy-json:3.0.18'
    //Implementation 'com.sparkjava:spark-core:2.9.4'

    // --- Zależności Testowe ---
    // Główne testy zależą od naszego nowego podprojektu
    testImplementation project(':rest-dsl')

    // Testy potrzebują Spocka do działania
    testImplementation 'org.spockframework:spock-core:2.3-groovy-3.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // I potrzebują wszystkich narzędzi do testów integracyjnych
    testImplementation 'com.sparkjava:spark-core:2.9.4'
    testImplementation 'org.slf4j:slf4j-simple:1.7.32'
    testImplementation 'org.awaitility:awaitility-groovy:4.2.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.9.3'
    // UWAGA: Zależność wiremock-jre8-standalone jest teraz w podprojekcie,
    // ale ponieważ testy też mogą go potrzebować, zostawienie jej tutaj nie zaszkodzi.
    testImplementation 'com.github.tomakehurst:wiremock-jre8-standalone:2.35.0'
}

test {
    useJUnitPlatform()
    testLogging.showStandardStreams = true
}